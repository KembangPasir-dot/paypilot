<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayPilot — Tagih siapa pun lewat chat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <h1>PayPilot</h1>
      <p class="tagline">Tagih siapa pun lewat chat — AI + PayPal</p>
    </div>
    <span id="mode-badge" class="mode-badge mode-unknown" title="Status koneksi backend">Memeriksa…</span>
  </div>
</header>

<main class="layout">
  <section class="chat-panel" aria-label="Chat PayPilot">
    <div id="chat" class="chat-window" aria-live="polite"></div>

    <div class="chips" id="chips" aria-label="Contoh perintah">
      <button type="button" class="chip" data-prompt="Tagih Budi budi@example.com Rp500.000 untuk desain logo, jatuh tempo minggu depan">Tagih Budi · Rp500.000 · desain logo</button>
      <button type="button" class="chip" data-prompt="Invoice Sarah sarah@example.com $120 for consulting, due Friday">Invoice Sarah · $120 · consulting</button>
      <button type="button" class="chip" data-prompt="Tagih Andi andi@example.com Rp1.500.000 untuk website, jatuh tempo 30 November">Tagih Andi · Rp1.500.000 · website</button>
    </div>

    <form id="chat-form" class="composer" autocomplete="off">
      <label class="sr-only" for="chat-input">Tulis permintaan invoice</label>
      <input id="chat-input" type="text" placeholder="Contoh: Tagih Budi budi@example.com Rp500.000 untuk desain logo…" maxlength="1000">
      <button id="send-btn" type="submit">Kirim</button>
    </form>
  </section>

  <aside class="invoice-panel" aria-label="Daftar invoice">
    <div class="panel-head">
      <h2>Invoice</h2>
      <button id="refresh-btn" type="button" class="refresh-btn">Muat ulang</button>
    </div>
    <p id="invoice-count" class="invoice-count"></p>
    <ul id="invoice-list" class="invoice-list"></ul>
    <p id="invoice-empty" class="invoice-empty">Belum ada invoice. Coba kirim perintah lewat chat.</p>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
